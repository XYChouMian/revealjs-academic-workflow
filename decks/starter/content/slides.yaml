deck:
  title: Reveal.js 功能示例
  author: Your Name
  chapter_nav: true

slides:
  - slide_id: s01-cover
    layout: cover
    title: 一份 YAML，完整演示
    content:
      subtitle: 布局 · 图文 · 公式 · 导航
      concern: 修改 content/slides.yaml，然后构建。
      meta: [方向键翻页 · S 查看 Notes · F 全屏 · Esc 总览]
    cite: &cite academic-presentation · 功能示例
    sources: &sources [模板功能演示，非科研证据]
    notes: 封面布局。导航已启用，但封面不属于任何章节，不高亮。每页包含 notes 与 sources，cite 显示在页脚，右下角自动显示页码。

  - slide_id: s01-overview
    layout: chapter-overview
    title: 汇报结构
    content: {}
    sources: *sources
    notes: 本页不手写目录内容。构建器自动读取第一个 ending 之前的 section 标题，编号并生成可点击章名；修改章节页标题后，本页和顶部导航会一起更新。

  - slide_id: s02-section
    layout: section
    title: 信息与结构
    content:
      'no': '01'
      point_mode: hierarchy
      points:
        - {term: 解释, detail: 要点与公式, cue: MathJax / Mermaid}
        - {term: 比较, detail: 卡片与表格, cue: 层级 / 留白}
        - {term: 组织, detail: 路线与结论, cue: 研究步骤 / 讨论}
    sources: *sources
    notes: 章节页自动成为导航入口。本页展示富层级导读卡，下一章展示默认字符串写法。导航名称直接来自本页 title。

  - slide_id: s03-formula
    layout: bullets
    kicker: 要点 · 公式 · 流程图
    title: 内容源到演示稿
    content:
      lead: '行内公式：$y=\mathcal{H}(q)+\varepsilon$'
      bullets: ['展示公式：$$\hat q=\arg\min_q\|y-\mathcal{H}(q)\|^2$$']
      mermaid: |
        flowchart LR
          A[slides.yaml] --> B[构建]
          B --> C[HTML]
          C --> D[视觉验收]
      callout: {label: 提示, text: 公式和 Mermaid 均由本地依赖渲染。}
      box: {style: note, text: 复杂解释放入 Presenter Notes。}
    cite: *cite
    sources: *sources
    notes: bullets 布局同时展示 lead、要点、LaTeX 行内与独立公式、Mermaid、callout 和说明框。中文公式字符串用单引号保留单反斜杠。所有资源离线可用。

  - slide_id: s04-cards
    layout: compare
    title: 卡片：信息层级与文字自适应
    content:
      card_mode: hierarchy
      fit_text: {min: 20, max: 26, min_line_height: 1.42, max_line_height: 1.58}
      cols:
        - title: 分层内容
          thesis: 重要判断大而少
          detail: 解释区在限定字号和行高内自动适配可用高度；不降低最低可读字号。
          cue: thesis / detail / cue
        - title: 适配边界
          thesis: 字号与行高一起调整
          detail: 只在解释区选择不溢出的最大字号；保留清楚的标题、正文和限定语层级。
          cue: fit_text / min / max
      callout: {text: 本页无眉题，标题仍与普通内容页对齐。}
    cite: *cite
    sources: *sources
    notes: compare 展示富层级卡片。fit_text 只作用于明确受约束的 detail 区域，联动字号与行高；普通模式的 items 列表写法见路线页。

  - slide_id: s05-spacious
    layout: table
    kicker: table_mode · spacious
    title: 短表优先保证阅读舒适
    content:
      table_mode: spacious
      headers: [能力, 表现]
      rows:
        - [顶部标题, 有无眉题均对齐]
        - [行间留白, 自动利用剩余高度]
        - [重点行, 浅色突出]
      highlight_row: 2
      note: 短表使用 spacious；不通过缩字填满页面。
    cite: *cite
    sources: *sources
    notes: 舒适表格展示标题对齐、自动行高分配、highlight_row 与表下注释。眉题不会参与表格容器的伸展。

  - slide_id: s06-standard
    layout: table
    kicker: table_mode · standard
    title: 标准表格适合较多条目
    content:
      table_mode: standard
      headers: [阶段, 产物]
      rows:
        - [分析, 核心问题]
        - [策划, 页面论点]
        - [证据, 来源记录]
        - [资源, 独立图件]
        - [构建, HTML]
        - [验收, 截图报告]
        - [交付, 可演示目录]
    cite: *cite
    sources: *sources
    notes: 标准表格模式。与前后页使用相同数据类别，供直接比较字号、留白和密度。

  - slide_id: s07-compact
    layout: table
    kicker: table_mode · compact
    title: 紧凑模式仍须清楚可读
    content:
      table_mode: compact
      headers: [项目, 检查内容]
      rows:
        - [来源, sources 可追溯]
        - [说明, notes 完整]
        - [图件, 独立文件]
        - [路径, assets 自动复制]
        - [公式, MathJax 无错误]
        - [图表, Mermaid 正常]
        - [版面, 无溢出与裁切]
        - [页脚, 引用不碰撞]
        - [导航, 当前章节正确]
      note: compact 仅在确有较多信息时使用；旧 dense 写法仍兼容。
    cite: *cite
    sources: *sources
    notes: 紧凑模式用于密度对比，最小字号仍为 18px。表格剩余空间仍自动分配，不压缩行距来隐藏溢出。

  - slide_id: s08-roadmap
    layout: roadmap
    title: 路线页：把工作组织成步骤
    content:
      steps:
        - {phase: '1 · 定内容', items: [论点与证据]}
        - {phase: '2 · 配资源', items: [图件与来源]}
        - {phase: '3 · 验收', items: [截图与修复]}
      note: 阶段卡也支持 thesis / detail / cue 与 fit_text。
    cite: *cite
    sources: *sources
    notes: roadmap 默认列表卡片。富层级写法与 compare 一致，详见前面的卡片页，避免重复展示同一功能。

  - slide_id: s09-section
    layout: section
    title: 图像与交付
    content:
      'no': '02'
      points: [大图与三种图文模式, 自定义入口与结论卡]
    sources: *sources
    notes: 章节页普通列表写法。导航自动切换到第二章；点击第一章可返回。

  - slide_id: s10-image
    layout: image
    title: 大图页：让图像成为主体
    content:
      src: assets/diagrams/workflow.svg
      caption: 自绘工作流示意；非论文原图。
      alt: 证据、论证、资源、生成和验收的五阶段流程
    cite: *cite
    sources: *sources
    notes: image 布局自动占用剩余高度，保留图注；SVG 作为独立文件加载，不裁切、不拉伸。构建自动复制 assets，file 和 localhost 均可访问。

  - slide_id: s11-side
    layout: image-text
    title: 均衡双栏：图文同等重要
    content:
      image_mode: side
      side: right
      image: {src: assets/diagrams/square.svg, caption: 自绘近方图；图放右侧。}
      bullets: [近方图适用均衡双栏, side 控制图在左或右]
    cite: *cite
    sources: *sources
    notes: image_mode 为 side，side 为 right，文字左图右；默认 left 为图左文右。近方图用于展示纵横比适配。

  - slide_id: s12-dominant
    layout: image-text
    title: 图片主导：横图获得更宽空间
    content:
      image_mode: side-dominant
      image:
        src: assets/diagrams/white-background.png
        caption: 白底融合试用；原图保持不变。
        white_background: blend
      bullets: [横图优先分配宽度, 文字保留舒适栏宽]
      callout: {text: 图片保持原始比例。}
    cite: *cite
    sources: *sources
    notes: 中等横图使用 side-dominant。与前后页对照三种显式图片模式，不需要填写 max_height。

  - slide_id: s13-hero
    layout: image-text
    title: 宽图主导：全宽主图与结论带
    content:
      image_mode: wide-hero
      image: {src: assets/diagrams/wide.svg, caption: 自绘宽图；不是实验数据。}
      bullets: [先明确问题, 再形成论证, 最后检查交付]
    cite: *cite
    sources: *sources
    notes: 极宽图使用 wide-hero。图片占主区域，下方横向结论带；所有模式均 object-fit contain，不猜测叙事结构。

  - slide_id: s14-html
    layout: html
    title: PNG 与 JPG：原图和白底融合对照
    content:
      html: |
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px 22px;background:#eee9df;padding:14px;border-radius:12px;">
          <div><h3>PNG · 原图</h3><div class="figure"><img style="height:175px;width:100%;object-fit:contain;" src="assets/diagrams/white-background.png" alt="PNG 原图白色背景"></div></div>
          <div><h3>PNG · blend</h3><div class="figure figure-white-blend"><img style="height:175px;width:100%;object-fit:contain;" src="assets/diagrams/white-background.png" alt="同一 PNG 融合背景"></div></div>
          <div><h3>JPG · 原图</h3><div class="figure"><img style="height:175px;width:100%;object-fit:contain;" src="assets/diagrams/white-background.jpg" alt="JPG 原图白色背景"></div></div>
          <div><h3>JPG · blend</h3><div class="figure figure-white-blend"><img style="height:175px;width:100%;object-fit:contain;" src="assets/diagrams/white-background.jpg" alt="同一 JPG 融合背景"></div></div>
        </div>
        <p style="font-size:20px;">使用你提供的截图原件；左右同文件，灰米色底用于放大差异。</p>
        <span class="fragment" style="font-size:18px;">原图不变；内部白色与彩色区域也会受底色影响。</span>
    cite: *cite
    sources: *sources
    notes: 使用用户提供的 white-background.png 和 white-background.jpg 原件，上排 PNG、下排 JPG，左侧原样、右侧 multiply 融合。只比较同一行左右效果，不把两份截图的尺寸、内容差别归因于格式。JPG 可能存在近白色压缩痕迹，融合不是按纯白阈值删除像素。保留 HTML 备用入口与 fragment 演示。常规使用仅需在 image 中设置 white_background 为 blend，如 s12-dominant。热力图、色标与灰度数据图应保留 original。

  - slide_id: s15-conclusion
    layout: conclusion
    title: 一份内容源，完成生成与验收
    content:
      conclusion_mode: cards
      labels: {takeaways: 内容, open: 显示, next: 交付}
      takeaways: [YAML 唯一内容源, Notes 与来源可追溯]
      open: [导航自动高亮, 图表公式离线显示]
      next: [自动复制资源, 构建后集中验收]
      callout: {text: 本示例只演示功能，不提供科研结论。}
    cite: *cite
    sources: *sources
    notes: conclusion 展示结论卡和自定义栏目名；默认不设 cards 时为纵向结论框。方向键、触摸、Esc 总览、S Notes、F 全屏均由 Reveal 提供。构建、checkpoint/restore 与自动验收属于工作流能力，由脚本验证，无须另加展示页。

  - slide_id: s16-ending
    layout: ending
    title: 感谢聆听
    content:
      subtitle: 自动化负责呈现，人负责判断与证据
      prompt: 讨论与提问
      meta: [academic-presentation, Reveal.js workflow]
    sources: *sources
    notes: ending 是视觉结束页，也是正文与附录的结构边界。顶部导航在本页取消高亮；后续 section 不进入章节总览和导航。导航仍保留，可随时返回正文。

  - slide_id: s17-appendix-section
    layout: section
    title: 附录 · 配置说明
    content:
      'no': A
      points: [结束页后的章节仍可使用 section 视觉样式, 但不会进入正文目录或顶部导航]
    sources: *sources
    notes: 这是 ending 后的附录章节，用来验证自动排除。顶部导航只列“信息与结构”和“图像与交付”，且附录阶段不高亮任何正文章节。

  - slide_id: s18-appendix
    layout: bullets
    kicker: 附录
    title: 结构边界由页面类型自动识别
    content:
      bullets:
        - ending 之前的 section 属于正文章节
        - ending 之后的 section 属于附录，不进入总览和导航
        - 整份演示最多一个 ending；缺省时所有 section 都属于正文
      callout: {text: 不需要逐页填写 exclude_from_nav。}
    cite: *cite
    sources: *sources
    notes: 本页展示附录内容页。它不属于任何正文章节，因此顶部导航没有高亮项；点击导航章名仍可返回正文。
