deck:
  title: 自动章节导航示例
  chapter_nav: true

slides:
  - slide_id: nav-cover
    layout: cover
    title: 自动章节导航
    content:
      subtitle: '只需在 deck 中设置 chapter_nav: true'
    sources: [工作流功能示例]
    notes: 封面不属于任何章节，因此导航不高亮。

  - slide_id: nav-chapter-one
    layout: section
    title: 问题与证据
    content:
      'no': '01'
      points: [章节由 section 页自动识别, 后续内容自动归属本章]
    sources: [工作流功能示例]
    notes: 从本页开始高亮第一章，直到下一个章节页。

  - slide_id: nav-table
    layout: table
    title: 导航不改变表格内部布局
    content:
      table_mode: spacious
      headers: [操作, 自动行为]
      rows:
        - [点击章名, 跳转对应章节页]
        - [翻到内容页, 高亮前面最近的章节]
        - [调整页面顺序, 重新构建后自动更新归属]
        - [关闭开关, 恢复完整视口]
    cite: academic-presentation · 章节导航示例
    sources: [工作流功能示例]
    notes: 本页故意不写 kicker，标题仍和有眉题的普通内容页对齐。表格按剩余高度分配行间留白。

  - slide_id: nav-chapter-two
    layout: section
    title: 结论与下一步
    content:
      'no': '02'
      points: [只维护 slides.yaml, 构建后自动生成导航]
    sources: [工作流功能示例]
    notes: 点击顶部第一章可以返回，直接通过地址跳到本页也会正确高亮。

  - slide_id: nav-summary
    layout: bullets
    kicker: 功能说明
    title: 页面顺序就是章节归属
    content:
      bullets:
        - 章节页的 title 就是导航章名，不维护第二份目录。
        - 章名较多或较长时，导航可以横向滚动。
        - 当前章节超出可视范围时，自动滚动到可见位置。
    cite: academic-presentation · 章节导航示例
    sources: [工作流功能示例]
    notes: 关闭功能只需将 chapter_nav 改为 false。未配置时默认关闭。
